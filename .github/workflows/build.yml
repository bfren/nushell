name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
    # docs-only pushes would rebuild the same VERSION, which main refuses
    paths-ignore: ['**.md']
  workflow_dispatch:

# one run per branch at a time - on other branches a newer push cancels the older run, so it cannot finish last and
# overwrite the newer images; on main it waits, so a release is never cancelled halfway through tagging
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        distro: [ "alpine", "bullseye", "bookworm", "trixie" ]
        nushell: [ "0.116.1", "0.117.0" ]
    permissions:
      # to create the release
      contents: write
    uses: bfren/docker/.github/workflows/build-bin.yml@main
    with:
      image: nushell
      build-args: |
        DISTRO=${{ matrix.distro }}
        NUSHELL_VERSION=${{ matrix.nushell }}
      tags: |
        ${{ matrix.nushell }}-${{ matrix.distro }}-${VERSION}
        ${{ matrix.nushell }}-${{ matrix.distro }}
    secrets:
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
