name: publish

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
    # docs-only pushes would rebuild the same VERSION, which main refuses
    paths-ignore: ['**.md']
  workflow_dispatch:

# one run per branch at a time - on other branches a newer push cancels the older run, so it cannot finish last and
# overwrite the newer images; on main it waits, so a release is never cancelled halfway through tagging
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # no bullseye: the glibc builds need glibc 2.34 but Debian 11 has 2.31, so nu could not start there - and
        # Debian 11 reached end of life on 2026-08-31
        distro: [ "alpine", "bookworm", "trixie" ]
        nushell: [ "0.116.1", "0.117.0" ]
    permissions:
      # to create the release
      contents: write
    uses: bfren/docker/.github/workflows/build-bin.yml@main
    with:
      image: nushell
      build-args: |
        DISTRO=${{ matrix.distro }}
        NUSHELL_VERSION=${{ matrix.nushell }}
      tags: |
        ${{ matrix.nushell }}-${{ matrix.distro }}-${VERSION}
        ${{ matrix.nushell }}-${{ matrix.distro }}
    secrets:
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}

  # one check whose name does not change, for the ruleset to require - the matrix jobs are named after their distro
  # and Nushell version, so requiring them means editing the ruleset whenever the matrix changes
  build-complete:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      -
        name: Check every build passed
        # needs.build.result is 'success' only if every job in the matrix succeeded
        run: test "${RESULT}" = "success" || { echo "The build matrix finished with result '${RESULT}'." ; exit 1 ; }
        env:
          RESULT: ${{ needs.build.result }}
