name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  workflow_dispatch:

# one run per branch at a time - a newer push cancels the older run, so it cannot finish last and overwrite the
# newer images
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        distro: [ "alpine", "bullseye", "bookworm", "trixie" ]
        nushell: [ "0.116.1" ]
    uses: bfren/docker/.github/workflows/build-bin.yml@main
    with:
      image: nushell
      build-args: |
        DISTRO=${{ matrix.distro }}
        NUSHELL_VERSION=${{ matrix.nushell }}
      tags: |
        ${{ matrix.nushell }}-${{ matrix.distro }}-${VERSION}
        ${{ matrix.distro }}-${VERSION}
        ${{ matrix.nushell }}-${{ matrix.distro }}
        ${{ matrix.distro }}
    secrets:
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
